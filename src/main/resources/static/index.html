<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ Chi Tiêu">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>Sổ Chi Tiêu Du Học</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Inter:wght@500;600;700&display=swap">
<style>
/* Bố cục: một cột cho thao tác một tay. Thẻ kính mờ trên nền có quầng xanh ngọc nhẹ.
   Trên: thẻ thực nhận + mục tiêu. Giữa: nhập nhanh + biểu đồ. Dưới: lịch sử.
   Thanh tab nổi bo tròn tách khỏi đáy, nút + tròn đứng cạnh. */
:root{
  --bg:#F4F7F9; --glow:rgba(16,185,129,.16); --glow-2:rgba(56,189,248,.10);
  --card:rgba(255,255,255,.78); --card-solid:#FFFFFF; --card-2:rgba(15,23,42,.045);
  --stroke:rgba(15,23,42,.07); --stroke-hi:rgba(255,255,255,.9);
  --fg:#0B1220; --fg-2:#334155; --muted:#64748B;
  --income:#059669; --income-hi:#10B981; --income-soft:rgba(16,185,129,.12);
  --expense:#E11D48; --expense-soft:rgba(244,63,94,.10); --warn:#D97706;
  --on-income:#FFFFFF; --scrim:rgba(15,23,42,.38);
  --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 28px -12px rgba(15,23,42,.14);
  --shadow-lg:0 18px 40px -16px rgba(15,23,42,.28);
  --hero-1:#0F172A; --hero-2:#064E3B; --hero-fg:#F8FAFC; --hero-muted:#9FB0C4;
  --heat-0:rgba(15,23,42,.06);
  --nav-bg:rgba(255,255,255,.82);
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"Inter","Be Vietnam Pro",system-ui,sans-serif;
  --r-xl:28px; --r-lg:22px; --r-md:16px; --r-sm:12px;
  --nav-h:68px; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1120; --glow:rgba(16,185,129,.20); --glow-2:rgba(56,189,248,.08);
  --card:rgba(30,41,59,.62); --card-solid:#1E293B; --card-2:rgba(148,163,184,.08);
  --stroke:rgba(148,163,184,.12); --stroke-hi:rgba(255,255,255,.06);
  --fg:#F1F5F9; --fg-2:#CBD5E1; --muted:#8A9BB2;
  --income:#10B981; --income-hi:#34D399; --income-soft:rgba(16,185,129,.15);
  --expense:#F43F5E; --expense-soft:rgba(244,63,94,.15); --warn:#F59E0B;
  --on-income:#03140E; --scrim:rgba(2,6,23,.66);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-lg:0 20px 44px -16px rgba(0,0,0,.7);
  --hero-1:#13203A; --hero-2:#0A4A3A; --hero-fg:#F8FAFC; --hero-muted:#9FB0C4;
  --heat-0:rgba(148,163,184,.10); --nav-bg:rgba(22,32,50,.78); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1120; --glow:rgba(16,185,129,.20); --glow-2:rgba(56,189,248,.08);
  --card:rgba(30,41,59,.62); --card-solid:#1E293B; --card-2:rgba(148,163,184,.08);
  --stroke:rgba(148,163,184,.12); --stroke-hi:rgba(255,255,255,.06);
  --fg:#F1F5F9; --fg-2:#CBD5E1; --muted:#8A9BB2;
  --income:#10B981; --income-hi:#34D399; --income-soft:rgba(16,185,129,.15);
  --expense:#F43F5E; --expense-soft:rgba(244,63,94,.15); --warn:#F59E0B;
  --on-income:#03140E; --scrim:rgba(2,6,23,.66);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-lg:0 20px 44px -16px rgba(0,0,0,.7);
  --hero-1:#13203A; --hero-2:#0A4A3A; --hero-fg:#F8FAFC; --hero-muted:#9FB0C4;
  --heat-0:rgba(148,163,184,.10); --nav-bg:rgba(22,32,50,.78); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
/* Quầng sáng nền để lớp kính mờ có chiều sâu */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 40% at 15% 0%,var(--glow),transparent 70%),radial-gradient(50% 35% at 100% 30%,var(--glow-2),transparent 70%)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--income-hi);outline-offset:3px;border-radius:8px}

/* ===== Chữ & số ===== */
.num,input[type=number]{font-family:var(--num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"cv11" 1;letter-spacing:-.015em}
.muted{color:var(--muted)} .inc{color:var(--income)} .exp{color:var(--expense)}
.lbl{font-size:.78rem;color:var(--muted);letter-spacing:.005em}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.title{font-size:1.02rem;font-weight:650;letter-spacing:-.01em;margin:0;color:var(--fg)}
.sub{font-size:.8rem;color:var(--muted)}
.link{border:0;background:none;color:var(--income);font-weight:600;padding:6px 2px;font-size:.84rem;border-radius:8px;transition:opacity .15s}
.link:active{opacity:.6}

/* ===== Khung ===== */
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh}
.topbar{position:sticky;top:0;z-index:5;
  padding:calc(var(--sat) + 14px) max(20px,env(safe-area-inset-right)) 12px max(20px,env(safe-area-inset-left));
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  background:linear-gradient(var(--bg) 60%,transparent);}
.hello{min-width:0}
.hello .lbl{display:block;margin-bottom:2px}
.hello b{display:block;font-size:1.6rem;font-weight:750;letter-spacing:-.025em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.month{display:flex;align-items:center;background:var(--card);border:1px solid var(--stroke);border-radius:999px;padding:3px;flex:none;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.month button{border:0;background:none;width:34px;height:34px;border-radius:50%;font-size:1.1rem;color:var(--muted);transition:background .15s,transform .15s var(--ease)}
.month button:active{background:var(--card-2);transform:scale(.9)}
.month strong{min-width:66px;text-align:center;font-size:.86rem;font-weight:650}
.screen{padding:6px max(20px,env(safe-area-inset-right)) calc(var(--nav-h) + var(--sab) + 56px) max(20px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:20px}
.section{display:flex;flex-direction:column;gap:12px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 4px}

/* ===== Thẻ kính mờ ===== */
.card{background:var(--card);border:1px solid var(--stroke);border-radius:var(--r-xl);padding:20px;
  box-shadow:var(--shadow);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);position:relative}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 1px 0 var(--stroke-hi)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}

/* ===== Thẻ tổng quan ===== */
.hero{border-radius:var(--r-xl);padding:22px 20px 20px;color:var(--hero-fg);display:flex;flex-direction:column;gap:20px;position:relative;overflow:hidden;
  background:radial-gradient(120% 120% at 100% 0%,var(--hero-2) 0%,var(--hero-1) 58%);box-shadow:var(--shadow-lg);
  border:1px solid rgba(255,255,255,.08)}
.hero::before{content:"";position:absolute;width:220px;height:220px;right:-70px;top:-90px;border-radius:50%;
  background:radial-gradient(circle,rgba(52,211,153,.35),transparent 65%);pointer-events:none}
.hero>*{position:relative}
.hero .lbl{color:var(--hero-muted)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero .big{font-size:2.6rem;font-weight:750;line-height:1.05;letter-spacing:-.035em;margin-top:6px}
.eye{border:1px solid rgba(255,255,255,.12);width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.08);color:var(--hero-fg);display:grid;place-items:center;flex:none;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .18s var(--ease),background .18s}
.eye:active{transform:scale(.9)}
.eye svg{width:20px;height:20px}
.pill{font-size:.72rem;font-weight:650;padding:4px 10px;border-radius:999px;background:rgba(52,211,153,.18);color:#6EE7B7;white-space:nowrap}
.breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.breakdown>div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07);border-radius:var(--r-md);padding:10px 10px 11px;min-width:0}
.breakdown .lbl{font-size:.7rem;white-space:nowrap;display:block;margin-bottom:3px}
.breakdown .num{font-size:clamp(.76rem,3.5vw,.92rem);font-weight:650;display:block;white-space:nowrap;letter-spacing:-.025em}
.goal{display:flex;flex-direction:column;gap:9px}
.goal-line{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.82rem}
.track{height:10px;border-radius:999px;background:rgba(255,255,255,.10);overflow:hidden}
.track>i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#059669,#34D399);box-shadow:0 0 12px rgba(52,211,153,.55);transition:width .8s var(--ease)}
.goal-empty{border:1px dashed rgba(255,255,255,.22);border-radius:var(--r-md);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(255,255,255,.04);color:inherit;text-align:left;width:100%;transition:transform .15s var(--ease)}
.goal-empty:active{transform:scale(.98)}

/* ===== Nhập nhanh ===== */
.templates{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:4px 20px 8px;scroll-snap-type:x proximity}
.templates::-webkit-scrollbar{display:none}
.tpl{flex:none;scroll-snap-align:start;border:1px solid var(--stroke);background:var(--card);border-radius:var(--r-lg);padding:12px 14px 12px 12px;display:flex;align-items:center;gap:10px;min-width:140px;text-align:left;
  box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .18s var(--ease),border-color .18s}
.tpl:active{transform:scale(.95)}
.tpl .e{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:1.1rem;background:var(--income-soft);flex:none}
.tpl.out .e{background:var(--expense-soft)}
.tpl b{display:block;font-size:.88rem;font-weight:650;white-space:nowrap}
.tpl .lbl{font-size:.74rem}

/* ===== Biểu đồ ===== */
.seg{display:inline-grid;grid-auto-flow:column;background:var(--card-2);border-radius:12px;padding:3px;gap:2px}
.seg button{white-space:nowrap;border:0;background:none;padding:6px 12px;border-radius:9px;font-size:.8rem;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--card-solid);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:160px;padding-top:20px}
.barcol{display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end;min-width:0}
.barcol .v{font-size:.66rem;color:var(--muted);white-space:nowrap}
.barcol .b{width:100%;max-width:30px;border-radius:9px 9px 5px 5px;background:var(--income-soft);min-height:5px;transform-origin:bottom;animation:grow .6s var(--ease) both}
.barcol.top .b{background:linear-gradient(180deg,var(--income-hi),var(--income));box-shadow:0 6px 16px -6px rgba(16,185,129,.7)}
.barcol.top .v{color:var(--income);font-weight:650}
.barcol .d{font-size:.7rem;color:var(--muted)}
.barcol.today .d{color:var(--fg);font-weight:700}
.bars.empty-chart .b{background:repeating-linear-gradient(180deg,var(--card-2) 0 4px,transparent 4px 8px);animation:none}
@keyframes grow{from{transform:scaleY(.05);opacity:.3}to{transform:none;opacity:1}}
.heat-wd,.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat-wd span{text-align:center;font-size:.66rem;color:var(--muted);padding-bottom:4px}
.heat .c{aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--heat-0);display:grid;place-items:center;font-size:.68rem;color:var(--muted)}
.heat .c.pad{background:none}
.heat .c[data-l="1"]{background:rgba(16,185,129,.25);color:var(--fg)}
.heat .c[data-l="2"]{background:rgba(16,185,129,.48);color:var(--fg)}
.heat .c[data-l="3"]{background:rgba(16,185,129,.74);color:#03140E}
.heat .c[data-l="4"]{background:#10B981;color:#03140E;font-weight:700;box-shadow:0 4px 12px -4px rgba(16,185,129,.8)}
.heat .c.today{box-shadow:inset 0 0 0 2px var(--fg)}
.legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:12px;font-size:.68rem;color:var(--muted)}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.chart-note{margin:14px 0 0;font-size:.82rem;color:var(--muted)}
.chart-note b{color:var(--fg);font-weight:650}

/* ===== Ngân sách ===== */
.bar{height:10px;background:var(--card-2);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--income);border-radius:999px;transition:width .7s var(--ease)}
.bar.over>i{background:var(--expense)} .bar.near>i{background:var(--warn)}
.stat{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:14px}
.stat .num{font-size:1.35rem;font-weight:750;letter-spacing:-.03em}

/* ===== Lịch sử ===== */
.day{display:flex;justify-content:space-between;align-items:baseline;padding:4px 6px 8px}
.list{background:var(--card);border:1px solid var(--stroke);border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--shadow);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.day-group{display:flex;flex-direction:column;margin-bottom:18px;animation:rise .4s var(--ease) both}
.tx{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:14px 16px;position:relative;transition:background .15s}
.tx+.tx::before{content:"";position:absolute;top:0;left:70px;right:16px;height:1px;background:var(--stroke)}
.tx:active{background:var(--card-2)}
.tx .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:1.1rem;background:var(--card-2)}
.tx.in .ic{background:var(--income-soft)}
.tx .t{min-width:0}
.tx b{display:block;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .r{text-align:right}
.tx .amt{font-weight:700;display:block;font-size:.98rem}
.tx .sub{font-size:.72rem;color:var(--muted);display:block;white-space:nowrap}
.tx .sub .exp{color:var(--expense)}

/* ===== Empty state ===== */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 24px 26px;gap:6px}
.empty svg{width:132px;height:104px;margin-bottom:6px}
.empty .title{font-size:1rem}
.empty .sub{max-width:250px}
.empty .btn{margin-top:12px}
.float{animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ===== Form ===== */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
input,select{border:1px solid var(--stroke);background:var(--card-2);border-radius:var(--r-sm);padding:12px 13px;width:100%;font-size:16px;color:var(--fg);transition:border-color .15s,background .15s}
input:focus{outline:none;border-color:var(--income-hi);background:transparent}
input::placeholder{color:var(--muted)}
.btn{border:1px solid var(--stroke);background:var(--card-solid);border-radius:var(--r-md);padding:13px 18px;font-weight:650;transition:transform .15s var(--ease),filter .15s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,var(--income-hi),var(--income));border-color:transparent;color:var(--on-income);box-shadow:0 8px 20px -10px rgba(16,185,129,.8)}
.btn.danger{color:var(--expense)}
.btn.block{width:100%}
.btn:disabled{opacity:.6}
.setting-row{display:flex;gap:10px;margin-top:12px}
.setting-row input{flex:1}

/* ===== Thanh điều hướng nổi ===== */
.dock{position:fixed;left:0;right:0;z-index:10;bottom:calc(12px + var(--sab));pointer-events:none;
  padding:0 max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left))}
.dock-in{max-width:452px;margin:0 auto;display:flex;gap:10px;align-items:center}
.nav{pointer-events:auto;flex:1;height:var(--nav-h);border-radius:26px;background:var(--nav-bg);border:1px solid var(--stroke);
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:var(--shadow-lg);
  display:grid;grid-template-columns:repeat(3,1fr);padding:6px;position:relative}
.nav-ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/3);border-radius:20px;background:var(--income-soft);
  transition:transform .35s var(--ease);pointer-events:none}
.tab{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.7rem;font-weight:550;color:var(--muted);border-radius:20px;transition:color .2s}
.tab svg{width:23px;height:23px;transition:transform .25s var(--ease)}
.tab[aria-current="page"]{color:var(--income);font-weight:700}
.tab[aria-current="page"] svg{transform:translateY(-1px) scale(1.06)}
.tab:active svg{transform:scale(.88)}
.fab{pointer-events:auto;flex:none;width:var(--nav-h);height:var(--nav-h);border-radius:24px;border:0;color:var(--on-income);
  background:linear-gradient(160deg,var(--income-hi),var(--income));box-shadow:0 14px 28px -10px rgba(16,185,129,.75),inset 0 1px 0 rgba(255,255,255,.35);
  display:grid;place-items:center;transition:transform .2s var(--ease)}
.fab svg{width:28px;height:28px;transition:transform .3s var(--ease)}
.fab:active{transform:scale(.92)}
.fab:active svg{transform:rotate(90deg)}

/* ===== Bảng trượt ===== */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:480px;margin:0 auto;background:var(--card-solid);
  border-radius:30px 30px 0 0;padding:8px 20px calc(18px + var(--sab));max-height:94dvh;overflow-y:auto;
  transform:translateY(105%);visibility:hidden;transition:transform .34s var(--ease),visibility 0s linear .34s;border:1px solid var(--stroke);border-bottom:0;box-shadow:0 -20px 50px -20px rgba(0,0,0,.4)}
.sheet.open{transform:none;visibility:visible;transition:transform .34s var(--ease)}
.grip{width:42px;height:5px;border-radius:3px;background:var(--stroke);margin:6px auto 12px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sheet-head h2{margin:0;font-size:1.2rem;font-weight:750;letter-spacing:-.02em}
.x{border:0;background:var(--card-2);width:36px;height:36px;border-radius:50%;transition:transform .15s}
.x:active{transform:scale(.9)}
.typeseg{display:grid;grid-template-columns:1fr 1fr;background:var(--card-2);border-radius:var(--r-md);padding:4px;margin-bottom:14px}
.typeseg button{border:0;background:none;padding:10px;border-radius:12px;font-weight:650;color:var(--muted);transition:background .2s,color .2s}
.typeseg button[aria-pressed="true"]{background:var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.typeseg button#tInc[aria-pressed="true"]{color:var(--income)}
.typeseg button#tExp[aria-pressed="true"]{color:var(--expense)}
.amt-in{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:4px 0 2px}
.amt-in input{border:0;border-bottom:2px solid var(--stroke);border-radius:0;background:none;text-align:center;font-size:2.5rem;font-weight:750;padding:0 0 4px;width:100%;max-width:290px;-moz-appearance:textfield}
.amt-in input:focus{border-color:var(--income-hi)}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.amt-in span{font-size:1.4rem;color:var(--muted)}
.quick{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:12px 0 16px}
.chip{border:1px solid var(--stroke);background:var(--card-2);border-radius:999px;padding:7px 12px;font-size:.8rem;font-weight:550;transition:transform .12s var(--ease),background .15s}
.chip:active{transform:scale(.92);background:var(--income-soft)}
.costbox{background:var(--card-2);border-radius:var(--r-lg);padding:14px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.costbox .row{display:flex;align-items:center;gap:10px}
.costbox input{background:var(--card-solid);flex:1}
.costbox .quick{justify-content:flex-start;margin:0}
.costbox .chip{background:var(--card-solid)}
.netline{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--stroke);padding-top:10px}
.netline .num{font-size:1.2rem;font-weight:750;color:var(--income)}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.catbtn{border:1px solid var(--stroke);background:var(--card-2);border-radius:var(--r-md);padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.7rem;line-height:1.2;text-align:center;min-height:74px;transition:transform .15s var(--ease),border-color .15s,background .15s}
.catbtn:active{transform:scale(.94)}
.catbtn .e{font-size:1.3rem}
.catbtn[aria-pressed="true"]{border-color:var(--income-hi);background:var(--income-soft);font-weight:650}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.error{color:var(--expense);font-size:.85rem;min-height:1.2em;margin:0 0 8px}
.actions{display:grid;grid-template-columns:auto 1fr;gap:10px}
.actions.single{grid-template-columns:1fr}

/* ===== Đăng nhập ===== */
.auth{max-width:400px;margin:0 auto;padding:calc(var(--sat) + 10vh) 24px 40px;display:flex;flex-direction:column;gap:22px;animation:rise .5s var(--ease) both}
.logo{width:60px;height:60px;border-radius:20px;background:linear-gradient(160deg,var(--income-hi),var(--income));display:grid;place-items:center;color:var(--on-income);font-weight:800;font-size:1.5rem;box-shadow:0 14px 28px -12px rgba(16,185,129,.8)}
.auth h1{margin:0;font-size:1.8rem;font-weight:750;letter-spacing:-.03em}
.auth form{display:flex;flex-direction:column;gap:14px}

/* ===== Chuyển cảnh ===== */
.screen.enter>*{animation:rise .42s var(--ease) both}
.screen.enter>*:nth-child(2){animation-delay:.04s}
.screen.enter>*:nth-child(3){animation-delay:.08s}
.screen.enter>*:nth-child(4){animation-delay:.12s}
.screen.enter>*:nth-child(5){animation-delay:.16s}
.screen.enter>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (hover:hover){
  .tpl:hover,.btn:hover,.chip:hover,.catbtn:hover{transform:translateY(-1px)}
  .tx:hover{background:var(--card-2)}
  .fab:hover{transform:translateY(-2px)}
}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--sab) + 30px);transform:translate(-50%,16px) scale(.96);opacity:0;z-index:30;
  background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:.85rem;font-weight:600;transition:.25s var(--ease);pointer-events:none;white-space:nowrap;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
body.loading .screen{opacity:.6;transition:opacity .2s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:360px){.hero .big{font-size:2.1rem}.hello b{font-size:1.35rem}}

/* ===== Lớp sinh động: aurora, ví, màu danh mục, donut, chuỗi ngày, ngôn ngữ ===== */
.aurora{position:absolute;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none;z-index:0}
.aurora i{position:absolute;width:260px;height:260px;border-radius:50%;filter:blur(46px);opacity:.55;mix-blend-mode:screen}
.aurora i:nth-child(1){background:#10B981;top:-120px;right:-60px;animation:drift1 14s ease-in-out infinite alternate}
.aurora i:nth-child(2){background:#22D3EE;bottom:-150px;left:-90px;opacity:.35;animation:drift2 17s ease-in-out infinite alternate}
.aurora i:nth-child(3){background:#A78BFA;top:30%;right:-140px;opacity:.28;animation:drift3 20s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(-90px,70px) scale(1.15)}}
@keyframes drift2{to{transform:translate(110px,-60px) scale(1.2)}}
@keyframes drift3{to{transform:translate(-120px,-40px) scale(.9)}}
.hero>.aurora{position:absolute}
.wallet{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:inherit;border-radius:16px;padding:9px 13px;text-align:left;
  display:flex;align-items:center;gap:10px;min-width:0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .15s var(--ease),background .15s}
.wallet:active{transform:scale(.97)}
.wallet .wi{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(140deg,#34D399,#22D3EE);color:#03140E;flex:none}
.wallet .wi svg{width:17px;height:17px}
.wallet .lbl{display:block;font-size:.68rem;color:var(--hero-muted)}
.wallet .wamt{display:block;font-weight:700;font-size:1rem;white-space:nowrap}
.wallet.unset .wamt{font-family:var(--font);font-size:.86rem;color:#6EE7B7}
.streak{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:650;padding:3px 9px;border-radius:999px;margin-top:6px;
  background:linear-gradient(90deg,rgba(251,146,60,.18),rgba(244,63,94,.14));color:#F97316}
.donut-wrap{display:grid;grid-template-columns:130px 1fr;gap:18px;align-items:center}
.donut{position:relative;width:130px;height:130px}
.donut svg{width:130px;height:130px;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:16;transition:stroke-dasharray .7s var(--ease)}
.donut .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.donut .center b{display:block;font-size:.95rem;font-weight:750}
.legend-list{display:flex;flex-direction:column;gap:9px;min-width:0}
.lg{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;font-size:.8rem}
.lg i{width:10px;height:10px;border-radius:3px}
.lg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lg .num{font-weight:650}
.langsw{display:inline-grid;grid-auto-flow:column;gap:2px;background:var(--card);border:1px solid var(--stroke);border-radius:999px;padding:3px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.langsw button{border:0;background:none;padding:5px 10px;border-radius:999px;font-size:.78rem;font-weight:650;color:var(--muted)}
.langsw button[aria-pressed="true"]{background:var(--income-soft);color:var(--income)}
.auth-top{display:flex;justify-content:space-between;align-items:center}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.78rem}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--stroke)}
#gBtn{display:flex;justify-content:center;min-height:44px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.tpl .e,.tx .ic,.catbtn .e{transition:transform .2s var(--ease)}
.tpl:active .e{transform:rotate(-8deg) scale(1.08)}
.sheet .bal-in{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:6px 0 4px}
.sheet .bal-in input{border:0;border-bottom:2px solid var(--stroke);border-radius:0;background:none;text-align:center;font-size:2.3rem;font-weight:750;padding:0 0 4px;width:100%;max-width:290px;-moz-appearance:textfield}
.sheet .bal-in input:focus{border-color:var(--income-hi)}
</style>
</head>
<body>

<!-- ========== ĐĂNG NHẬP ========== -->
<div class="auth" id="authView" hidden>
  <div class="auth-top">
    <div class="logo">₩</div>
    <div class="langsw" role="group" aria-label="Language">
      <button data-lang-set="vi">VI</button><button data-lang-set="en">EN</button><button data-lang-set="ko">한</button>
    </div>
  </div>
  <div>
    <h1 data-i18n="appName">Sổ Chi Tiêu Du Học</h1>
    <p class="muted" style="margin:6px 0 0" data-i18n="tagline"></p>
  </div>
  <div id="googleBox" hidden>
    <div id="gBtn"></div>
    <div class="divider" style="margin-top:16px" data-i18n="or"></div>
  </div>
  <form id="authForm" novalidate>
    <div class="field" id="nameField" hidden><label class="lbl" for="displayName" data-i18n="displayName"></label>
      <input id="displayName" maxlength="60" autocomplete="nickname"></div>
    <div class="field"><label class="lbl" for="email">Email</label>
      <input id="email" type="email" inputmode="email" autocomplete="email"></div>
    <div class="field"><label class="lbl" for="password" data-i18n="password"></label>
      <input id="password" type="password" autocomplete="current-password"></div>
    <p class="error" id="authError"></p>
    <button class="btn primary block" type="submit" id="authSubmit"></button>
  </form>
  <p class="muted" style="margin:0;text-align:center"><span id="switchText"></span>
    <button class="link" id="switchMode" type="button"></button></p>
</div>

<!-- ========== APP ========== -->
<div class="app" id="appView" hidden>
  <header class="topbar">
    <div class="hello"><span class="lbl" id="screenSub"></span><b id="screenTitle"></b><span class="streak" id="streak" hidden></span></div>
    <div class="month" id="monthNav">
      <button id="prev" data-i18n-aria="prevMonth">‹</button>
      <strong id="monthLabel" class="num">—</strong>
      <button id="next" data-i18n-aria="nextMonth">›</button>
    </div>
  </header>

  <!-- ===== Tổng quan ===== -->
  <main class="screen" id="homeScreen">
    <section class="hero">
      <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="hero-top">
        <button class="wallet" id="walletBtn">
          <span class="wi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7H5a2 2 0 0 1 0-4h13v4"/><path d="M3 5v14a2 2 0 0 0 2 2h15V7"/><circle cx="16" cy="14" r="1.4" fill="currentColor"/></svg></span>
          <span style="min-width:0"><span class="lbl" data-i18n="currentBalance"></span><span class="wamt num" id="curBalance">—</span></span>
        </button>
        <button class="eye" id="eyeBtn" aria-pressed="false">
          <svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg id="eyeClosed" hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
        </button>
      </div>
      <div>
        <div class="lbl" data-i18n="netThisMonth"></div>
        <div class="big num" id="netIncome">0₩</div>
      </div>
      <div class="breakdown">
        <div><span class="lbl" data-i18n="grossIncome"></span><span class="num" id="income">0₩</span></div>
        <div><span class="lbl" data-i18n="incomeCost"></span><span class="num" id="incomeCost">0₩</span></div>
        <div><span class="lbl" data-i18n="leftThisMonth"></span><span class="num" id="balance">0₩</span></div>
      </div>
      <div class="goal" id="goalBox">
        <div class="goal-line"><span class="lbl"><span data-i18n="monthlyGoal"></span> <b class="num" id="goalTarget" style="color:var(--hero-fg)"></b></span><span class="pill" id="goalPct">0%</span></div>
        <div class="track"><i id="goalBar"></i></div>
        <div class="goal-line"><span class="lbl" id="goalRemain"></span><button class="link" data-go="settings" style="color:#34D399" data-i18n="edit"></button></div>
      </div>
      <button class="goal-empty" id="goalEmpty" data-go="settings" hidden>
        <span><b style="display:block" data-i18n="setGoalTitle"></b><span class="lbl" data-i18n="setGoalSub"></span></span>
        <span class="pill" data-i18n="setNow"></span>
      </button>
    </section>

    <section class="section">
      <div class="section-head"><h2 class="title" data-i18n="quickAdd"></h2><span class="sub" data-i18n="quickAddSub"></span></div>
      <div class="templates" id="templates"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <div><h2 class="title" data-i18n="netIncomeChart"></h2><span class="sub" id="chartSub"></span></div>
        <div class="seg" role="group">
          <button id="view7" aria-pressed="true" data-i18n="days7"></button>
          <button id="viewMonth" aria-pressed="false" data-i18n="month"></button>
        </div>
      </div>
      <div id="chart7" class="bars"></div>
      <div id="chartMonth" hidden>
        <div class="heat-wd" id="heatWd"></div>
        <div class="heat" id="heat"></div>
        <div class="legend"><span data-i18n="less"></span> <i style="background:var(--heat-0)"></i><i style="background:rgba(16,185,129,.28)"></i><i style="background:rgba(16,185,129,.5)"></i><i style="background:rgba(16,185,129,.75)"></i><i style="background:#10B981"></i> <span data-i18n="more"></span></div>
      </div>
      <p class="chart-note" id="chartNote"></p>
    </section>

    <section class="card" id="spendCard">
      <div class="card-head" style="margin-bottom:14px"><div><h2 class="title" data-i18n="spendByCat"></h2><span class="sub num" id="budgetPct"></span></div></div>
      <div class="donut-wrap" id="donutWrap">
        <div class="donut"><svg viewBox="0 0 130 130" id="donutSvg"></svg><div class="center"><span><span class="lbl" data-i18n="spent"></span><b class="num" id="donutTotal">0₩</b></span></div></div>
        <div class="legend-list" id="donutLegend"></div>
      </div>
      <div id="budgetBlock">
        <div class="bar" id="budgetBar" style="margin-top:18px"><i></i></div>
        <div class="stat"><span class="lbl" id="dailyLabel"></span><span class="num" id="dailyLimit">—</span></div>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><h2 class="title" data-i18n="recent"></h2><button class="link" data-go="history" data-i18n="seeAll"></button></div>
      <div class="list" id="recent"></div>
    </section>
  </main>

  <!-- ===== Lịch sử ===== -->
  <main class="screen" id="historyScreen" hidden><div id="history"></div></main>

  <!-- ===== Cài đặt ===== -->
  <main class="screen" id="settingsScreen" hidden>
    <section class="card">
      <h2 class="title" data-i18n="currentBalance"></h2>
      <p class="sub" style="margin:4px 0 0" data-i18n="balanceHelp"></p>
      <button class="btn block" style="margin-top:12px" id="openBalance" data-i18n="updateBalance"></button>
    </section>
    <section class="card">
      <h2 class="title" data-i18n="goalSetting"></h2>
      <form class="setting-row" id="goalForm" novalidate>
        <input id="goalInput" type="number" min="0" step="10000" inputmode="numeric" placeholder="2000000">
        <button class="btn primary" type="submit" data-i18n="save"></button>
      </form>
      <p class="sub" style="margin:8px 0 0" data-i18n="goalHelp"></p>
    </section>
    <section class="card">
      <h2 class="title" data-i18n="budgetSetting"></h2>
      <form class="setting-row" id="budgetForm" novalidate>
        <input id="budgetInput" type="number" min="0" step="10000" inputmode="numeric" placeholder="1000000">
        <button class="btn primary" type="submit" data-i18n="save"></button>
      </form>
      <p class="sub" style="margin:8px 0 0" data-i18n="budgetHelp"></p>
    </section>
    <section class="card">
      <h2 class="title" data-i18n="language"></h2>
      <div class="seg" role="group" style="margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr)">
        <button data-lang-set="vi">Tiếng Việt</button><button data-lang-set="en">English</button><button data-lang-set="ko">한국어</button>
      </div>
      <h2 class="title" style="margin-top:20px" data-i18n="theme"></h2>
      <div class="seg" role="group" style="margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr)">
        <button data-theme-set="system" data-i18n="themeSystem"></button><button data-theme-set="light" data-i18n="themeLight"></button><button data-theme-set="dark" data-i18n="themeDark"></button>
      </div>
    </section>
    <section class="card">
      <h2 class="title" data-i18n="account"></h2>
      <p style="margin:8px 0 0"><b id="userName"></b><br><span class="sub" id="userEmail"></span></p>
      <p class="sub" style="margin:10px 0 0" data-i18n="installHelp"></p>
    </section>
    <button class="btn block danger" id="logout" data-i18n="logout"></button>
  </main>

  <div class="dock">
    <div class="dock-in">
      <nav class="nav">
        <span class="nav-ind" id="navInd" aria-hidden="true"></span>
        <button class="tab" data-go="home" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span data-i18n="tabHome"></span></button>
        <button class="tab" data-go="history">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span data-i18n="tabHistory"></span></button>
        <button class="tab" data-go="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg><span data-i18n="tabSettings"></span></button>
      </nav>
      <button class="fab" id="fab" data-i18n-aria="addNew">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </div>
</div>

<!-- ========== BẢNG GHI / SỬA KHOẢN ========== -->
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
  <div class="grip"></div>
  <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="x" data-close data-i18n-aria="close">✕</button></div>
  <form id="txForm" novalidate>
    <div class="typeseg" role="group">
      <button type="button" id="tInc" aria-pressed="true" data-i18n="income"></button>
      <button type="button" id="tExp" aria-pressed="false" data-i18n="expense"></button>
    </div>
    <div class="lbl" style="text-align:center" id="amountLabel"></div>
    <div class="amt-in"><input id="amount" type="number" min="1" step="100" inputmode="numeric" placeholder="0"><span>₩</span></div>
    <div class="quick">
      <button type="button" class="chip" data-add="1000">+1,000</button>
      <button type="button" class="chip" data-add="10000">+10,000</button>
      <button type="button" class="chip" data-add="50000">+50,000</button>
      <button type="button" class="chip" data-add="100000">+100,000</button>
    </div>
    <div class="costbox" id="costBox">
      <label class="lbl" for="cost" data-i18n="costLabel"></label>
      <div class="row"><input id="cost" type="number" min="0" step="100" inputmode="numeric" placeholder="0"><span class="muted">₩</span></div>
      <div class="quick">
        <button type="button" class="chip" data-cost="3000">⛽ +3,000</button>
        <button type="button" class="chip" data-cost="5000">⛽ +5,000</button>
        <button type="button" class="chip" data-cost="10000">+10,000</button>
        <button type="button" class="chip" data-cost-reset data-i18n="clear"></button>
      </div>
      <div class="netline"><span class="lbl" data-i18n="netReceived"></span><span class="num" id="netPreview">0₩</span></div>
    </div>
    <div class="catgrid" id="catgrid"></div>
    <div class="row2">
      <div class="field"><label class="lbl" for="date" data-i18n="date"></label><input id="date" type="date"></div>
      <div class="field"><label class="lbl" for="memo" data-i18n="memo"></label><input id="memo" maxlength="100" data-i18n-ph="optional"></div>
    </div>
    <p class="error" id="txError"></p>
    <div class="actions single" id="actions">

  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const browserLang = (navigator.language || "vi").slice(0, 2);
let lang = store.get("sct-lang", ["vi", "en", "ko"].includes(browserLang) ? browserLang : "vi");
let token = store.get("sct-token", null);

const t = (k, vars = {}) => (I18N[lang][k] ?? I18N.vi[k] ?? k).replace(/\{(\w+)\}/g, (_, v) => vars[v] ?? "");
const catName = c => lang === "vi" ? c : (CATS[c] ? CATS[c][lang] : c);
const catIcon = c => (CATS[c] || CATS["Khác"]).e;
const catColor = c => (CATS[c] || CATS["Khác"]).c;

const raw = n => Math.round(Math.abs(n)).toLocaleString("ko-KR") + "₩";

const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;

  return `${WD[lang][d.getDay()]}, ${dm(d)}`;
}

// ============================ API ============================
async function api(path, { method = "GET", body } = {}) {
  const headers = { "Content-Type": "application/json", "Accept-Language": lang };
  if (token) headers.Authorization = "Bearer " + token;
  let res;
  try { res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined }); }
  catch { throw new Error(t("errNetwork")); }
  if (res.status === 401 && token) { logout(); throw new Error(t("errSession")); }
  if (res.status === 204) return null;
  const data = await res.json().catch(() => null);
  if (!res.ok) {
    if (res.status === 409) throw new Error(t("errTaken"));
    if (res.status === 401 && path.includes("/login")) throw new Error(t("errBadLogin"));
    if (res.status === 401 && path.includes("/google")) throw new Error(t("errGoogle"));
    const fields = data && data.fields ? Object.values(data.fields) : [];
    throw new Error(fields[0] || (data && data.message) || "Error " + res.status);
  }
  return data;
}

let registerMode = false;
function setAuthMode(reg) {
  registerMode = reg;
  $("authSubmit").textContent = reg ? t("createAccount") : t("login");
  $("switchText").textContent = reg ? t("haveAccount") : t("noAccount");

$("authForm").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("email").value.trim(), password = $("password").value, name = $("displayName").value.trim();
  const err = !/^\S+@\S+\.\S+$/.test(email) ? t("errEmail") : password.length < 6 ? t("errPassword") : registerMode && !name ? t("errName") : "";
  $("authError").textContent = err; if (err) return;
  const btn = $("authSubmit"); btn.disabled = true;

});
async function signedIn(tok) { token = tok; store.set("sct-token", tok); $("password").value = ""; await showApp(); }
function logout() {
  token = null; store.del("sct-token");
  try { window.google && google.accounts.id.disableAutoSelect(); } catch {}
  $("appView").hidden = true; $("authView").hidden = false; closeSheets(); setAuthMode(false);
}

// ---- Đăng nhập bằng Google (Google Identity Services) ----
let googleClientId = "";
async function initGoogle() {
  try { googleClientId = (await api("/api/auth/config")).googleClientId || ""; } catch { googleClientId = ""; }
  if (!googleClientId) return;
  await new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client"; s.async = true; s.onload = ok; s.onerror = fail;
    document.head.appendChild(s);
  }).catch(() => {});
  if (!window.google) return;
  google.accounts.id.initialize({
    client_id: googleClientId,
    callback: async resp => {
      $("authError").textContent = "";
      try { const data = await api("/api/auth/google", { method: "POST", body: { credential: resp.credential } }); await signedIn(data.token); }
      catch (ex) { $("authError").textContent = ex.message; }
    }
  });
  renderGoogleButton();
}
function renderGoogleButton() {
  if (!googleClientId || !window.google) return;
  $("googleBox").hidden = false; $("gBtn").innerHTML = "";
  const dark = document.documentElement.dataset.theme === "dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  google.accounts.id.renderButton($("gBtn"), {
    type: "standard", theme: dark ? "filled_black" : "outline", size: "large", shape: "pill", text: "continue_with",
    locale: lang, width: Math.min(352, $("gBtn").clientWidth || 352)
  });
}

let view = new Date(today.getFullYear(), today.getMonth(), 1);
let me = null, items = [], prevItems = [], summary = null, chartMode = "7", lastGoalPct = null;

async function showApp() {
  me = await api("/api/me");
  $("userName").textContent = me.displayName; $("userEmail").textContent = me.email;
  $("budgetInput").value = me.monthlyBudget || ""; $("goalInput").value = me.monthlyIncomeGoal || "";
  $("authView").hidden = true; $("appView").hidden = false;
  renderTemplates(); go("home");
  await load();
}
async function load() {
  const key = monthKey(view), prevKey = monthKey(new Date(view.getFullYear(), view.getMonth() - 1, 1));
  document.body.classList.add("loading");
  try {
    const [list, prev, s] = await Promise.all([
      api("/api/transactions?month=" + key), api("/api/transactions?month=" + prevKey), api("/api/summary?month=" + key)]);
    items = list.sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id); prevItems = prev;
    const reached = lastGoalPct !== null && lastGoalPct < 100 && (s.goalPercent ?? 0) >= 100 && s.month === summary?.month;
    summary = s; lastGoalPct = s.goalPercent ?? 0;
    renderAll();
    if (reached) confetti();
  } finally { document.body.classList.remove("loading"); }
}
function renderAll() {
  $("monthLabel").textContent = view.toLocaleDateString(LOCALE[lang], lang === "vi" ? { month: "2-digit", year: "numeric" } : { month: "short", year: "numeric" });
  if (!summary) return;
  renderHero(); renderChart(); renderSpend(); renderLists(); renderStreak();
}

// ---------- Thẻ tổng quan ----------
let lastNet = 0, countRaf;
function countUp(el, to) {
  cancelAnimationFrame(countRaf);
  const from = lastNet; lastNet = to;
  const f = v => money(v, v < 0 ? "−" : "");
  if (privacy || from === to || matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = f(to); return; }
  const t0 = performance.now(), dur = 700;
  const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = f(Math.round(from + (to - from) * e)); if (k < 1) countRaf = requestAnimationFrame(step); };
  countRaf = requestAnimationFrame(step);
}
function renderHero() {
  const s = summary;
  const set = s.currentBalance !== null && s.currentBalance !== undefined;
  $("walletBtn").classList.toggle("unset", !set);
  $("curBalance").textContent = set ? money(s.currentBalance, s.currentBalance < 0 ? "−" : "") : t("setBalance");
  countUp($("netIncome"), s.netIncome);
  $("income").textContent = money(s.income);
  $("incomeCost").textContent = money(s.incomeCost, s.incomeCost ? "−" : "");
  $("balance").textContent = money(s.balance, s.balance < 0 ? "−" : "");
  $("balance").style.color = s.balance < 0 ? "#FB7185" : "";
  const hasGoal = s.incomeGoal > 0;
  $("goalBox").hidden = !hasGoal; $("goalEmpty").hidden = hasGoal;
  if (hasGoal) {
    const pct = s.goalPercent ?? 0;
    $("goalTarget").textContent = money(s.incomeGoal);
    $("goalPct").textContent = pct + "%";
    $("goalBar").style.width = Math.min(pct, 100) + "%";
    $("goalRemain").innerHTML = s.goalRemaining > 0 ? t("goalRemain", { x: `<b class="num" style="color:var(--hero-fg)">${money(s.goalRemaining)}</b>` }) : t("goalDone");
  }
}
function renderStreak() {
  const days = new Set([...items, ...prevItems].map(i => i.date));
  let n = 0; const d = new Date(today);
  if (!days.has(ymd(d))) d.setDate(d.getDate() - 1); // hôm nay chưa ghi thì vẫn giữ chuỗi tới hôm qua
  while (days.has(ymd(d))) { n++; d.setDate(d.getDate() - 1); }
  $("streak").textContent = n >= 2 ? t("streak", { n }) : "";
  $("streak").hidden = current !== "home" || n < 2;
}

// ---------- Biểu đồ thu nhập ----------
function dailyNet(list) { const m = {}; list.forEach(i => { if (i.type === "INCOME") m[i.date] = (m[i.date] || 0) + i.amount - (i.cost || 0); }); return m; }
function renderChart() {
  $("view7").setAttribute("aria-pressed", chartMode === "7"); $("viewMonth").setAttribute("aria-pressed", chartMode === "month");
  $("chart7").hidden = chartMode !== "7"; $("chartMonth").hidden = chartMode !== "month";
  $("chartSub").textContent = chartMode === "7" ? t("last7") : t("heatSub");
  const daily = dailyNet([...items, ...prevItems]);
  if (chartMode === "7") {
    const isCur = monthKey(view) === monthKey(today);
    const end = isCur ? new Date(today) : new Date(view.getFullYear(), view.getMonth() + 1, 0);
    const days = [...Array(7)].map((_, k) => { const d = new Date(end); d.setDate(end.getDate() - 6 + k); return d; });
    const vals = days.map(d => Math.max(0, daily[ymd(d)] || 0));
    const max = Math.max(...vals), top = max > 0 ? vals.indexOf(max) : -1, ph = [35, 55, 40, 70, 50, 85, 60];
    $("chart7").classList.toggle("empty-chart", max === 0);
    $("chart7").innerHTML = days.map((d, k) => `<div class="barcol${k === top ? " top" : ""}${ymd(d) === ymd(today) ? " today" : ""}">
      <span class="v num">${vals[k] ? short(vals[k]) : ""}</span>
      <span class="b" style="height:${max ? Math.max(4, vals[k] / max * 100) : ph[k]}%;animation-delay:${k * 40}ms"></span>
      <span class="d">${ymd(d) === ymd(today) ? t("today") : WD[lang][d.getDay()]}</span></div>`).join("");
    $("chartNote").innerHTML = max > 0
      ? t("note7", { x: `<b class="num">${money(vals.reduce((a, b) => a + b, 0))}</b>`, d: `<b>${WD[lang][days[top].getDay()]} ${dm(days[top])}</b>` })
      : t("note7Empty");
  } else {
    const y = view.getFullYear(), m = view.getMonth(), n = new Date(y, m + 1, 0).getDate();
    const offset = (new Date(y, m, 1).getDay() + 6) % 7;
    const vals = [...Array(n)].map((_, k) => Math.max(0, daily[`${y}-${pad(m + 1)}-${pad(k + 1)}`] || 0));
    const max = Math.max(...vals), level = v => !v ? 0 : Math.min(4, Math.ceil(v / max * 4));
    $("heat").innerHTML = '<span class="c pad"></span>'.repeat(offset) + vals.map((v, k) => {
      const iso = `${y}-${pad(m + 1)}-${pad(k + 1)}`;
      return `<span class="c${iso === ymd(today) ? " today" : ""}" data-l="${level(v)}" title="${privacy ? "" : raw(v)}">${k + 1}</span>`;
    }).join("");
    const best = vals.indexOf(max);
    $("chartNote").innerHTML = max > 0
      ? t("noteMonth", { n: `<b>${vals.filter(Boolean).length}</b>`, d: `<b>${dm(new Date(y, m, best + 1))}</b>`, x: `<span class="num">${money(max)}</span>` })
      : t("noteMonthEmpty");
  }
}
$("view7").onclick = () => { chartMode = "7"; renderChart(); };
$("viewMonth").onclick = () => { chartMode = "month"; renderChart(); };

// ---------- Chi tiêu theo danh mục (biểu đồ tròn) + ngân sách ----------
function renderSpend() {
  const s = summary, cats = s.expenseByCategory || [];
  const R = 52, C = 2 * Math.PI * R;
  $("donutTotal").textContent = money(s.expense);
  if (!cats.length) {
    $("donutSvg").innerHTML = `<circle cx="65" cy="65" r="${R}" stroke="var(--card-2)" stroke-dasharray="4 6"></circle>`;
    $("donutLegend").innerHTML = `<span class="sub">${t("noSpend")}</span>`;
  } else {
    let acc = 0;
    const top = cats.slice(0, 5), rest = cats.slice(5).reduce((a, c) => a + c.total, 0);
    const segs = top.map(c => ({ name: catName(c.category), color: catColor(c.category), v: c.total }));
    if (rest) segs.push({ name: catName("Khác"), color: catColor("Khác"), v: rest });
    $("donutSvg").innerHTML = `<circle cx="65" cy="65" r="${R}" stroke="var(--card-2)"></circle>` + segs.map(sg => {
      const len = sg.v / s.expense * C, gap = segs.length > 1 ? Math.min(3, len / 3) : 0;
      const el = `<circle cx="65" cy="65" r="${R}" stroke="${sg.color}" stroke-dasharray="${Math.max(0, len - gap)} ${C}" stroke-dashoffset="${-acc}" stroke-linecap="round"></circle>`;
      acc += len; return el;
    }).join("");
    $("donutLegend").innerHTML = segs.map(sg => `<div class="lg"><i style="background:${sg.color}"></i><span>${esc(sg.name)}</span><span class="num">${privacy ? "•••" : Math.round(sg.v / s.expense * 100) + "%"}</span></div>`).join("");
  }
  $("budgetBlock").hidden = !s.budget;
  $("budgetPct").textContent = s.budget && !privacy ? t("budgetOf", { a: raw(s.expense), b: raw(s.budget) }) : "";
  if (!s.budget) return;
  const pct = s.budgetUsedPercent ?? 0, bar = $("budgetBar");
  bar.className = "bar" + (pct > 100 ? " over" : pct > 80 ? " near" : "");
  bar.firstElementChild.style.width = Math.min(pct, 100) + "%";
  if (s.daysLeft) {
    const over = s.expense > s.budget;
    $("dailyLabel").textContent = over ? t("overBudget") : t("perDay", { n: s.daysLeft });
    $("dailyLimit").textContent = money(over ? s.expense - s.budget : s.dailyLimit);
    $("dailyLimit").className = "num" + (over ? " exp" : "");
  } else { $("dailyLabel").textContent = t("used"); $("dailyLimit").textContent = pct + "%"; $("dailyLimit").className = "num"; }
}

  return `<button class="tx${inc ? " in" : ""}" data-id="${i.id}"><span class="ic" style="background:${col}22">${catIcon(i.category)}</span>

    <span class="r"><span class="num amt ${inc ? "inc" : "exp"}">${money(inc ? i.amount - cost : i.amount, inc ? "+" : "−")}</span>${sub}</span></button>`;

  $("templates").innerHTML = TEMPLATES.map(tp => {
    const last = tplMemory[tp.id], col = catColor(tp.category);
    return `<button class="tpl" data-tpl="${tp.id}"><span class="e" style="background:${col}26">${catIcon(tp.category)}</span>
      <span><b>${esc(tp.name[lang])}</b><span class="lbl num">${last ? money(last.amount) : (tp.type === "INCOME" ? t("income") : t("expense"))}</span></span></button>`;
  }).join("");
}
$("templates").onclick = e => {
  const b = e.target.closest("[data-tpl]"); if (!b) return;
  const tp = TEMPLATES.find(x => x.id === b.dataset.tpl), last = tplMemory[tp.id] || {};
  openTx(null, { type: tp.type, category: tp.category, memo: tp.name[lang], amount: last.amount || "", cost: last.cost || "", tplId: tp.id, focusCost: tp.cost && !!last.amount });
};

// ============================ BẢNG TRƯỢT ============================
function openSheetEl(id) { closeSheets(); $("scrim").classList.add("open"); $(id).classList.add("open"); $(id).setAttribute("aria-hidden", "false"); }
function closeSheets() { $("scrim").classList.remove("open"); document.querySelectorAll(".sheet").forEach(s => { s.classList.remove("open"); s.setAttribute("aria-hidden", "true"); }); }
$("scrim").onclick = closeSheets;
document.addEventListener("click", e => { if (e.target.closest("[data-close]")) closeSheets(); if (e.target.closest("[data-open-sheet]")) openTx(null); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheets(); });

let type = "INCOME", category = INC_CATS[0], editingId = null, activeTpl = null;
function setType(tp, keep) {
  type = tp;
  $("tInc").setAttribute("aria-pressed", tp === "INCOME"); $("tExp").setAttribute("aria-pressed", tp === "EXPENSE");
  $("costBox").hidden = tp !== "INCOME";
  $("amountLabel").textContent = tp === "INCOME" ? t("grossLbl") : t("spendAmt");
  const cats = tp === "EXPENSE" ? EXP_CATS : INC_CATS;
  if (!keep || !cats.includes(category)) category = cats[0];
  $("catgrid").innerHTML = cats.map(c =>
    `<button type="button" class="catbtn" data-cat="${esc(c)}" aria-pressed="${c === category}"><span class="e">${catIcon(c)}</span>${esc(catName(c))}</button>`).join("");
  updateNet();
}
function updateNet() {
  const a = Number($("amount").value) || 0, c = Number($("cost").value) || 0;
  $("netPreview").textContent = raw(Math.max(0, a - c));
  $("netPreview").style.color = c > a ? "var(--expense)" : "";
}
$("tInc").onclick = () => setType("INCOME"); $("tExp").onclick = () => setType("EXPENSE");
$("amount").oninput = updateNet; $("cost").oninput = updateNet;
$("catgrid").onclick = e => { const b = e.target.closest(".catbtn"); if (!b) return; category = b.dataset.cat; $("catgrid").querySelectorAll(".catbtn").forEach(x => x.setAttribute("aria-pressed", x === b)); };
document.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { $("amount").value = (Number($("amount").value) || 0) + Number(b.dataset.add); updateNet(); });
document.querySelectorAll("[data-cost]").forEach(b => b.onclick = () => { $("cost").value = (Number($("cost").value) || 0) + Number(b.dataset.cost); updateNet(); });
document.querySelector("[data-cost-reset]").onclick = () => { $("cost").value = ""; updateNet(); };

const defaultDate = () => monthKey(today) === monthKey(view) ? ymd(today) : `${monthKey(view)}-01`;
function openTx(tx, preset) {
  editingId = tx ? tx.id : null; activeTpl = preset ? preset.tplId : null;
  $("sheetTitle").textContent = tx ? t("editTx") : preset ? preset.memo : t("newTx");
  $("deleteTx").hidden = !tx; $("deleteTx").textContent = t("delete"); delete $("deleteTx").dataset.confirm;
  $("actions").classList.toggle("single", !tx); $("txError").textContent = "";
  const src = tx || preset;
  if (src) { category = src.category; setType(src.type, true); $("amount").value = src.amount; $("cost").value = src.cost || ""; $("memo").value = src.memo || ""; $("date").value = tx ? tx.date : defaultDate(); }
  else { setType("INCOME"); $("amount").value = ""; $("cost").value = ""; $("memo").value = ""; $("date").value = defaultDate(); }
  updateNet(); openSheetEl("sheet");
  if (!tx) setTimeout(() => (preset && preset.focusCost ? $("cost") : $("amount")).focus(), 280);
}
$("fab").onclick = () => openTx(null);
document.addEventListener("click", e => { const row = e.target.closest(".tx"); if (!row) return; const tx = items.find(i => String(i.id) === row.dataset.id); if (tx) openTx(tx); });

$("txForm").addEventListener("submit", async e => {
  e.preventDefault();
  const amount = Number($("amount").value) || 0, cost = type === "INCOME" ? (Number($("cost").value) || 0) : 0, date = $("date").value;
  const err = amount <= 0 ? t("errAmount") : cost > amount ? t("errCost") : !date ? t("errDate") : "";
  $("txError").textContent = err; if (err) return;
  const btn = $("txSubmit"); btn.disabled = true;
  try {
    const body = { type, amount, cost, category, date, memo: $("memo").value.trim() };
    if (editingId) await api("/api/transactions/" + editingId, { method: "PUT", body });
    else await api("/api/transactions", { method: "POST", body });
    if (activeTpl) { tplMemory[activeTpl] = { amount, cost }; store.set("sct-templates", tplMemory); renderTemplates(); }
    const d = new Date(date + "T00:00:00"); view = new Date(d.getFullYear(), d.getMonth(), 1);
    closeSheets();
    toast(editingId ? t("tUpdated") : type === "INCOME" ? t("tSaved", { x: raw(amount - cost) }) : t("tSpent", { x: raw(amount) }));
    await load();
  } catch (ex) { $("txError").textContent = ex.message; }
  finally { btn.disabled = false; }
});
let confirmTimer;
$("deleteTx").onclick = async () => {
  const b = $("deleteTx");
  if (!b.dataset.confirm) { b.dataset.confirm = "1"; b.textContent = t("confirmDelete"); confirmTimer = setTimeout(() => { delete b.dataset.confirm; b.textContent = t("delete"); }, 3000); return; }
  clearTimeout(confirmTimer); delete b.dataset.confirm; b.textContent = t("delete");
  try { await api("/api/transactions/" + editingId, { method: "DELETE" }); closeSheets(); toast(t("tDeleted")); await load(); }
  catch (ex) { $("txError").textContent = ex.message; }
};

// ---- Số dư hiện tại ----
function openBalance() {
  $("balError").textContent = "";
  $("balInput").value = summary && summary.currentBalance !== null && summary.currentBalance !== undefined ? summary.currentBalance : "";
  openSheetEl("balSheet"); setTimeout(() => $("balInput").focus(), 280);
}
$("walletBtn").onclick = openBalance; $("openBalance").onclick = openBalance;
document.querySelectorAll("[data-bal]").forEach(b => b.onclick = () => { $("balInput").value = (Number($("balInput").value) || 0) + Number(b.dataset.bal); });
document.querySelector("[data-bal-reset]").onclick = () => { $("balInput").value = ""; };
$("balForm").addEventListener("submit", async e => {
  e.preventDefault();
  const v = $("balInput").value.trim();
  if (v === "" || isNaN(Number(v))) { $("balError").textContent = t("errBalance"); return; }
  try { me = await api("/api/me/balance", { method: "PUT", body: { currentBalance: Math.round(Number(v)) } }); closeSheets(); toast(t("tBalance")); await load(); }
  catch (ex) { $("balError").textContent = ex.message; }
});

// ============================ CÀI ĐẶT ============================
$("budgetForm").addEventListener("submit", async e => {
  e.preventDefault();
  try { me = await api("/api/me/budget", { method: "PUT", body: { monthlyBudget: Number($("budgetInput").value) || 0 } }); toast(t("tBudget")); go("home"); await load(); }
  catch (ex) { toast(ex.message); }
});
$("goalForm").addEventListener("submit", async e => {
  e.preventDefault();
  try { me = await api("/api/me/goal", { method: "PUT", body: { monthlyIncomeGoal: Number($("goalInput").value) || 0 } }); toast(t("tGoal")); go("home"); await load(); }
  catch (ex) { toast(ex.message); }
});

// ============================ PHÁO HOA KHI ĐẠT MỤC TIÊU ============================
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("confetti"), ctx = cv.getContext("2d"), dpr = devicePixelRatio || 1;
  cv.hidden = false; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const colors = ["#10B981", "#34D399", "#22D3EE", "#F59E0B", "#F472B6", "#A78BFA"];
  const ps = [...Array(140)].map(() => ({ x: innerWidth / 2, y: innerHeight * .3, vx: (Math.random() - .5) * 12, vy: Math.random() * -12 - 4,
    s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: colors[Math.random() * colors.length | 0] }));
  const t0 = performance.now();
  (function frame(now) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .6); ctx.restore(); });
    if (now - t0 < 2200) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, innerWidth, innerHeight); cv.hidden = true; }
  })(t0);
}

// ============================ KHỞI ĐỘNG ============================
try { const old = localStorage.getItem("sochitieu-token"); if (old && !token) { token = old; store.set("sct-token", old); } localStorage.removeItem("sochitieu-token"); } catch {}
applyTheme(); applyI18n(); applyPrivacy();
initGoogle();
if (token) showApp().catch(() => logout()); else logout();
</script>
